name: Scrapeo IMSERSO
on:
  schedule:
    - cron: "15 3 */2 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrapeo completo
        env:
          WORKERS: "1"
          MIN_GAP: "1.3"
          WAF_WAIT: "900"
        run: python imserso_finder.py --snapshot snapshot.json.gz
      - name: Publicar en la rama data
        run: |
          mkdir out && mv snapshot.json.gz out/
          cd out
          git init -q -b data
          git config user.name "imserso-bot"
          git config user.email "imserso-bot@users.noreply.github.com"
          git add snapshot.json.gz
          git commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
